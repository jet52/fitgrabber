[project]
name = "fitgrabber"
version = "0.1.0"
description = "Collect, organize, and analyze personal fitness data"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "fitdecode>=0.10",
    "gpxpy>=1.6",
    "tcxreader>=0.4",
    "garminconnect>=0.2",
    "stravalib>=2.0",
    "myfitnesspal>=2.0",
    "pandas>=2.0",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
]

[project.scripts]
fitgrabber = "fitgrabber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fitgrabber"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]
